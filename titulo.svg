<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150">
  <defs>
    <!-- Efecto RGB Rainbow infinito -->
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ff0000" />
      <stop offset="16%" stop-color="#ff7f00" />
      <stop offset="33%" stop-color="#ffff00" />
      <stop offset="50%" stop-color="#00ff00" />
      <stop offset="66%" stop-color="#0000ff" />
      <stop offset="83%" stop-color="#4b0082" />
      <stop offset="100%" stop-color="#9400d3" />
      <animate attributeName="x1" from="0%" to="-200%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" from="200%" to="0%" dur="3s" repeatCount="indefinite" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=VT323&amp;display=swap');
      .texto-hacker {
        font-family: 'VT323', 'Courier New', monospace;
        font-size: 42px;
        fill: url(#rainbow);
      }
      .subtexto {
        font-family: 'VT323', 'Courier New', monospace;
        font-size: 24px;
        fill: #ffffff;
      }
    </style>
  </defs>
  
  <rect width="100%" height="100%" fill="transparent" />
  
  <text x="50%" y="60" class="texto-hacker" text-anchor="middle">Armando Fidel Lorea Sanchez</text>
  <text x="50%" y="100" class="subtexto" text-anchor="middle">Estudiante de Ing. en Sistemas Computacionales</text>
</svg>
